<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Audit Portal | The Limo Marketing Agency</title>
<meta name="robots" content="noindex,nofollow">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
:root{--ink:#10141c;--muted:#738095;--blue:#5170FE;--navy:#0d1b42;--line:rgba(21,37,67,.09)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,rgba(81,112,254,.12),transparent 28%),linear-gradient(180deg,#fff,#f5f8fd);font-family:Inter,Arial,sans-serif;color:var(--ink)}
.card{width:min(100%,760px);padding:44px;border-radius:32px;background:#fff;border:1px solid var(--line);box-shadow:0 28px 90px rgba(17,40,88,.10)}
.kicker{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--blue);text-transform:uppercase}
h1{margin:14px 0 12px;font-family:Manrope,Arial,sans-serif;font-size:clamp(38px,7vw,68px);line-height:.95;letter-spacing:-.055em}
p{margin:0;color:var(--muted);font-size:14px;line-height:1.75;max-width:620px}
.note{margin-top:24px;padding:14px 16px;border-radius:14px;background:#f3f6ff;color:#61708b;font-size:11px;line-height:1.6}
.brand{margin-top:28px;font-family:Manrope,Arial,sans-serif;font-weight:800;font-size:13px}
@media(max-width:560px){.card{padding:28px 20px;border-radius:24px}}
</style>
</head>
<body>
<main class="card">
  <div class="kicker">The Limo Marketing Agency</div>
  <h1>Client Audit Portal</h1>
  <p>This portal hosts private-share audit reports prepared for individual clients. Please use the direct report link provided to you.</p>
  <div class="note">Reports are prepared for review and discussion with the intended client.</div>
  <div class="brand">Growth + Technology for Premium Transportation</div>
</main>
</body>
</html>
